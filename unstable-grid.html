<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Unstable Grid Test</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; padding: 16px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { padding: 10px; border: 1px solid #ddd; }
    th { background: #f5f5f5; position: sticky; top: 0; }
    .controls { display: flex; gap: 16px; align-items: center; margin: 12px 0; flex-wrap: wrap; }
    .pill { padding: 4px 10px; border: 1px solid #ddd; border-radius: 999px; background: #fff; }
    .note { color: #444; margin-top: 10px; }
  </style>
</head>
<body>

<h2>Unstable Grid (Pendo Targeting Stress Test)</h2>

<div class="controls">
  <label class="pill"><input id="shuffle" type="checkbox" checked /> Shuffle columns</label>
  <label class="pill"><input id="rebuild" type="checkbox" checked /> Rebuild header DOM</label>
  <label class="pill"><input id="interval" type="number" min="300" step="100" value="1200" style="width:90px"/> ms</label>
  <button id="force" class="pill" style="cursor:pointer;">Force rebuild now</button>
</div>

<table id="grid">
  <thead>
    <tr id="header-row"></tr>
  </thead>
  <tbody id="body"></tbody>
</table>

<p class="note">
  This page intentionally destroys and recreates the header and shuffles columns on an interval.
  It’s designed to reproduce “looks targetable, fails at runtime” guide behavior.
</p>

<script>
  const baseColumns = [
    { name: "Actions", key: "actions" },
    { name: "Issuer Name", key: "issuer" },
    { name: "Form Type", key: "formType" },
    { name: "Status", key: "status" },
    { name: "Updated", key: "updated" },
  ];

  const headerRow = document.getElementById("header-row");
  const body = document.getElementById("body");
  const shuffleToggle = document.getElementById("shuffle");
  const rebuildToggle = document.getElementById("rebuild");
  const intervalInput = document.getElementById("interval");
  const forceBtn = document.getElementById("force");

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function render(columns) {
    // Rebuild header DOM (new nodes each time) to simulate dynamic grid rebuilds
    headerRow.innerHTML = "";

    columns.forEach(col => {
      const th = document.createElement("th");

      // IMPORTANT: stable hook you can optionally test later
      // (FINRA equivalent would be adding a stable data attribute on the real UI)
      th.setAttribute("data-qa", `col-${col.key}`);

      // Nested spans to mimic UI framework wrappers
      const wrap = document.createElement("div");
      wrap.className = "hdr-wrap";

      const labelContainer = document.createElement("span");
      labelContainer.className = "hdr-label-container";

      const labelText = document.createElement("span");
      labelText.className = "hdr-label-text";
      labelText.textContent = col.name;

      labelContainer.appendChild(labelText);
      wrap.appendChild(labelContainer);
      th.appendChild(wrap);

      headerRow.appendChild(th);
    });

    body.innerHTML = "";
    for (let i = 0; i < 6; i++) {
      const tr = document.createElement("tr");

      columns.forEach(col => {
        const td = document.createElement("td");
        if (col.key === "actions") {
          const btn = document.createElement("button");
          btn.textContent = "Actions";
          btn.setAttribute("data-qa", "actions-btn");
          btn.onclick = () => alert(`Actions clicked for row ${i + 1}`);
          td.appendChild(btn);
        } else if (col.key === "issuer") {
          td.textContent = `Issuer ${i + 1}`;
        } else if (col.key === "formType") {
          td.textContent = ["211", "BD", "ADV"][i % 3];
        } else if (col.key === "status") {
          td.textContent = ["Open", "Closed", "Pending"][i % 3];
        } else if (col.key === "updated") {
          td.textContent = `${(i % 12) + 1}/${(i % 28) + 1}/2026`;
        }
        tr.appendChild(td);
      });

      body.appendChild(tr);
    }
  }

  let timer = null;

  function tick() {
    const cols = shuffleToggle.checked ? shuffle(baseColumns) : [...baseColumns];

    // If rebuild is unchecked, we still re-render content but keep header nodes stable-ish
    // (in practice, we still replace innerHTML here; toggle exists for easy comparison)
    render(cols);
  }

  function start() {
    if (timer) clearInterval(timer);
    tick();
    const ms = Number(intervalInput.value || 1200);
    timer = setInterval(() => {
      if (!rebuildToggle.checked) return; // “freeze” to compare behavior
      tick();
    }, ms);
  }

  forceBtn.addEventListener("click", tick);
  shuffleToggle.addEventListener("change", start);
  rebuildToggle.addEventListener("change", start);
  intervalInput.addEventListener("change", start);

  start();
</script>

</body>
</html>
